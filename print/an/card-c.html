.m-omote .quote em { font-style:normal; background:linear-gradient(transparent 60%,#FFE566 60%); }
.m-omote .from { display:flex; align-items:flex-end; gap:1.4mm; font-size:7.4pt; font-weight:700; color:#13232E; margin-top:2mm; }
.m-omote .from i { width:30mm; border-bottom:.3mm solid #13232E; height:5mm; }
.m-omote .offer { margin-top:auto; color:#fff; display:flex; align-items:baseline; gap:1.6mm; }

.m-omote .offer b .hiki { font-family:"Zen Maru Gothic",sans-serif; font-weight:900; font-size:11pt; }

/* 裏（C・D共通） */

.k-ura h2 { font-size:8.4pt; font-weight:900; color:#0D3B5C; }

.k-ura ol li::before { content:attr(data-n); width:3.2mm; height:3.2mm; border-radius:50%; background:#0D3B5C; color:#fff;

.k-ura .tel { font-size:14pt; color:#0D3B5C; line-height:1; margin-top:1mm; }

.k-ura .price { margin-top:auto; font-size:6.4pt; color:#3C5262; padding-bottom:1.2mm; }
.k-ura .foot { border-top:.25mm solid #D7E1E7; padding-top:1.3mm; display:flex; justify-content:space-between; align-items:baseline; }

.k-ura .foot p b { color:#C0300C; }
.k-ura .foot .trust { font-size:6.4pt; color:#0D3B5C; font-weight:700; white-space:nowrap; }
