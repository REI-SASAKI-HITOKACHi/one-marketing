<!-- トップページ main の先頭に入れている「テキスト」パーツ 43400 の中身。
     CMSの パーツ編集（テキスト）に、このまま貼ってあります。
     消せば元に戻ります。 -->
<section class="oh-stats">
  <style>
    .oh-stats{ padding:clamp(44px,6vw,80px) 28px; }
    .oh-stats .oh-stats__inner{ max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(20px,3vw,48px); }
    .oh-stats dl{ margin:0; text-align:center; }
    .oh-stats dt{ font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-size:clamp(34px,5.2vw,58px); line-height:1.1; letter-spacing:.02em; color:#d94739; font-weight:400; }
    .oh-stats dt .oh-stats__u{ font-size:.42em; margin-left:.12em; letter-spacing:.06em; }
    .oh-stats dd{ margin:14px 0 0; }
    .oh-stats .oh-stats__label{ font-size:14.5px; line-height:1.8; color:#2d2d2a; letter-spacing:.04em; }
    .oh-stats .oh-stats__note{ display:block; margin-top:8px; font-size:11.5px; line-height:1.7; color:#6f6e68; letter-spacing:.02em; }
    .oh-stats .oh-stats__rule{ width:40px; height:1px; background:rgba(45,45,42,.18); margin:16px auto 0; }
    @media(max-width:700px){
      .oh-stats{ padding-left:18px; padding-right:18px; }
      .oh-stats .oh-stats__inner{ grid-template-columns:1fr; gap:34px; }
    }
  </style>
  <div class="oh-stats__inner">
    <dl>
      <dt>★5.0</dt>
      <dd><span class="oh-stats__label">Googleクチコミの<br>平均評価</span><span class="oh-stats__note">23件・2026年9月時点</span><span class="oh-stats__rule"></span></dd>
    </dl>
    <dl>
      <dt>0<span class="oh-stats__u">円</span></dt>
      <dd><span class="oh-stats__label">お見積りのあとの<br>追加請求</span><span class="oh-stats__note">お出しした金額から増やしません。駐車場代と、高速道路を使う地域の交通費は先にお伝えします</span><span class="oh-stats__rule"></span></dd>
    </dl>
  </div>
</section>
