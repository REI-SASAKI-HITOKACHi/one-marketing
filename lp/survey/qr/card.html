<!doctype html>
<html lang="ja">

<title>アンケートQRカード｜ONE HITTER</title>

<style>
  /* 名刺サイズ（91×55mm）を A4 に 2列×5段＝10枚。
     ラミネートして現場社員が携行し、施工後にお客様へ提示する想定。 */
  @page { size: A4 portrait; margin: 7mm; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Zen Kaku Gothic New","IPAGothic",system-ui,sans-serif;background:#EDEAE4;padding:7mm;color:#14323D;
       -webkit-font-smoothing:antialiased}
  .sheet{display:grid;grid-template-columns:repeat(2,91mm);grid-auto-rows:55mm;justify-content:center}
  .card{width:91mm;height:55mm;background:#fff;border:0.2mm dashed #C6BFB3;
        padding:3.4mm 3.8mm 3.4mm 5mm;display:flex;gap:3.4mm;align-items:center;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2mm;background:#0E7C93}
  .l{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .brand{font-family:Barlow,sans-serif;font-weight:700;font-size:7pt;letter-spacing:.05em;color:#0E7C93;line-height:1.1}
  .brand small{display:block;font-family:"Zen Kaku Gothic New","IPAGothic",sans-serif;font-weight:500;
               font-size:5pt;color:#8A959A;letter-spacing:0;margin-top:.5mm}
  h1{font-size:10pt;font-weight:900;line-height:1.38;margin:1.9mm 0 1.3mm;letter-spacing:-.015em}
  h1 em{font-style:normal;background:linear-gradient(transparent 62%,#FFE566 62%);padding:0 .3mm}
  .lead{font-size:6.1pt;line-height:1.5;color:#4A6871}
  .off{margin-top:1.7mm;background:#FFF4E3;border:0.25mm solid #E2A845;border-radius:1mm;
       padding:1.2mm 1.6mm;font-size:5.9pt;line-height:1.45;color:#8A5B12}
  .off b{display:block;font-size:7.6pt;color:#A83714;line-height:1.3}
  .r{width:26mm;text-align:center;flex:none}
  .r img{width:26mm;height:26mm;display:block}
  .r .time{font-size:5.9pt;font-weight:700;color:#0E7C93;margin-bottom:.9mm;letter-spacing:.01em}
  .r .cap{font-size:5pt;color:#8A959A;margin-top:.9mm;line-height:1.35}
  @media print{ body{background:#fff;padding:0} .card{border-color:#DCD6CC} }
</style>
</head>

<div class="sheet" id="sheet"></div>
