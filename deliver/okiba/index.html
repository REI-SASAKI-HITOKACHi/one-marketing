<title>ワンヒッター 受け渡し棚</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 棚の板＝送り先ごとの段。左に宛先、右に1ファイル1行 */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1d2321; --muted:#5d6763; --line:#d9dedb;
  --accent:#0f6b5c; --accent-fg:#ffffff; --ok:#1d7a3a; --ng:#b3261e;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1c2220; --fg:#e7ece9; --muted:#9aa6a1; --line:#2f3835;
  --accent:#5cc2ad; --accent-fg:#0b1412; --ok:#6fd38c; --ng:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1c2220; --fg:#e7ece9; --muted:#9aa6a1; --line:#2f3835;
  --accent:#5cc2ad; --accent-fg:#0b1412; --ok:#6fd38c; --ng:#ff8a80; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header h1{font-size:1.45rem;margin:0;font-weight:700;text-wrap:balance}
header p{margin:.35rem 0 0;color:var(--muted);max-width:62ch}
.howto{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted)}
.howto b{color:var(--fg);font-weight:500}
.shelf{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shelf-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;
  padding:14px 16px;border-bottom:1px solid var(--line)}
.shelf-head h2{font-size:1.05rem;margin:0;font-weight:700}
.shelf-head .to{font-size:.85rem;color:var(--muted)}
.shelf-head .to code{font-family:var(--mono);font-size:.82rem;color:var(--fg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;
  padding:12px 16px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.name{min-width:0;overflow-wrap:anywhere}
.meta{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
button{font:inherit;font-size:.86rem;border-radius:7px;padding:7px 12px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.5;cursor:default}
.st{grid-column:1/-1;font-size:.82rem;min-height:0}
.st.ok{color:var(--ok)} .st.ng{color:var(--ng)}
.st a{color:var(--accent)}
.note{font-size:.84rem;color:var(--muted);padding:0 16px 14px}
.empty{padding:28px 16px;color:var(--muted)}
footer{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:1fr}.acts{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>受け渡し棚</h1>
    <p>CMO（Claude）が作ったファイルを、嶺さん・和真さんに渡すための置き場です。送り先ごとに段を分けています。</p>
  </header>
  <div class="howto">
    <span><b>端末に保存</b>：このスマホ・PCにダウンロード</span>
    <span><b>ドライブに保存</b>：嶺さんのGoogleドライブの指定フォルダへ（Gmailの「ドライブから挿入」で添付できます）</span>
  </div>
  <main id="shelves"><div class="empty">ファイルの一覧を読み込んでいます…</div></main>
  <footer id="foot"></footer>
</div>

<script>
(function(){
  var DRIVE = "Google Drive";
  var state = {list:null, downloads:null, mcp:null};
  var $ = function(id){return document.getElementById(id)};

  function kb(n){ return n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB"; }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function say(st, cls, text, href){
    st.className = "st " + (cls||""); st.textContent = text;
    if(href){ st.append(" "); var a=el("a",null,"ドライブで開く"); a.href=href; a.target="_blank"; a.rel="noopener"; st.append(a); }
  }
  async function blobOf(f){
    var r = await fetch("/_blob/" + f.asset);
    if(!r.ok) throw new Error("ファイルが見つかりません（" + r.status + "）");
    return await r.blob();
  }

  async function saveLocal(f, st, btn){
    if(!state.downloads){ say(st,"ng","この画面では端末への保存が使えません。claude.ai で開き直してください。"); return; }
    btn.disabled = true; say(st,"","準備しています…");
    try{
      var b = await blobOf(f);
      await state.downloads.save({filename: f.name, data: b});
      say(st,"ok","保存しました。");
    }catch(e){
      var c = e && e.code;
      say(st, c==="declined" ? "" : "ng", c==="declined" ? "保存を取りやめました。" : "保存できませんでした：" + (e.message||c||e));
    }finally{ btn.disabled = false; }
  }

  async function saveDrive(f, folder, st, btn){
    if(!state.mcp){ say(st,"ng","この画面ではドライブにつなげません（Googleドライブのコネクタが無い、または claude.ai の外で開いています）。"); return; }
    btn.disabled = true; say(st,"","ドライブに送っています…");
    try{
      var b = await blobOf(f);
      var input = {title: f.name, contentMimeType: "application/pdf", disableConversionToGoogleType: true,
                   base64Content: {$file: {data: b, name: "file.pdf", type: "application/pdf"}}};
      if(folder) input.parentId = folder;
      var r = await state.mcp.callTool(DRIVE, "create_file", input);
      var p = r && (r.payload || r.json) || {};
      say(st,"ok","ドライブに保存しました。", p.viewUrl || null);
    }catch(e){
      var c = e && e.code, m = {
        consent_required:"このページにGoogleドライブを使う許可が出ていません。上に出る確認で「許可」を押してから、もう一度押してください。",
        approval_required:"ドライブへの保存には承認が要ります。claude.ai でこのページを開いて、もう一度押してください。",
        server_not_connected:"Googleドライブのコネクタがつながっていません（claude.ai の設定 → コネクタ）。",
        capability_disabled:"この画面からは大きなファイルを送れません。claude.ai で開き直してください。"
      };
      say(st,"ng", m[c] || ("ドライブに保存できませんでした：" + (e.message||c||e)));
    }finally{ btn.disabled = false; }
  }

  function render(){
    var box = $("shelves"); box.textContent = "";
    var L = state.list;
    if(!L || !L.dan || !L.dan.length){ box.append(el("div","empty","いまは渡すファイルがありません。CMOが置いたらここに出ます。")); return; }
    L.dan.forEach(function(d){
      var s = el("section","shelf");
      var h = el("div","shelf-head"); h.append(el("h2",null,d.title));
      if(d.to){ var t = el("span","to","送り先 "); var c = el("code",null,d.to); t.append(c); h.append(t); }
      s.append(h);
      d.files.forEach(function(f){
        var r = el("div","row");
        var n = el("div","name"); n.append(el("div",null,f.name)); n.append(el("div","meta",kb(f.size) + (f.memo ? "　" + f.memo : "")));
        var a = el("div","acts"), st = el("div","st");
        var b1 = el("button","primary","端末に保存"); b1.type="button"; b1.onclick=function(){ saveLocal(f, st, b1); };
        a.append(b1);
        if(d.drive !== false){
          var b2 = el("button",null,"ドライブに保存"); b2.type="button"; b2.onclick=function(){ saveDrive(f, d.folder || L.folder, st, b2); };
          a.append(b2);
        }
        r.append(n, a, st); s.append(r);
      });
      if(d.note) s.append(el("p","note",d.note));
      box.append(s);
    });
    $("foot").textContent = L.updated ? "最終更新 " + L.updated + "（CMO）" : "";
  }

  fetch("files.json", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ state.list = j; render(); })
    .catch(function(){ state.list = null; render(); });

  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(function(d){ state.downloads = d; });
    window.claude.use("mcp").then(function(m){ state.mcp = m; });
  }
})();
</script>
